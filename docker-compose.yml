services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backbeatpager
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backbeatpager"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm db:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment: &database-environment
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backbeatpager
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/backbeatpager
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @backbeat/api dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      NODE_ENV: development
      PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @backbeat/web dev --hostname 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
